plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace 'org.koitharu.kotatsu.reader'
    compileSdk 36

    defaultConfig {
        minSdk 21
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    // Dependencies for the reader module will go here
    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.ssiv
}
